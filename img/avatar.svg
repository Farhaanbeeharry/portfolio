<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="3D avatar of a developer in a suit">
  <defs>
    <!-- backdrop -->
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0" stop-color="#20222a"/>
      <stop offset="58%" stop-color="#131418"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="30%" r="42%">
      <stop offset="0" stop-color="#f5b14c" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#f5b14c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f5b14c" stop-opacity="0"/>
    </radialGradient>

    <!-- skin -->
    <radialGradient id="skin" cx="41%" cy="30%" r="82%">
      <stop offset="0" stop-color="#f0c69e"/>
      <stop offset="42%" stop-color="#dca878"/>
      <stop offset="72%" stop-color="#c08a5c"/>
      <stop offset="100%" stop-color="#94643f"/>
    </radialGradient>
    <linearGradient id="neckSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b78455"/>
      <stop offset="1" stop-color="#8a5e3a"/>
    </linearGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3e2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff3e2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5a3a20" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5a3a20" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c9714a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9714a" stop-opacity="0"/>
    </radialGradient>

    <!-- hair -->
    <linearGradient id="hair" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#2c261f"/>
      <stop offset="0.5" stop-color="#1a1510"/>
      <stop offset="1" stop-color="#0d0a07"/>
    </linearGradient>

    <!-- suit -->
    <linearGradient id="jacket" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#333842"/>
      <stop offset="0.55" stop-color="#232830"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <linearGradient id="lapel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b414b"/>
      <stop offset="1" stop-color="#1c2026"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2ec"/>
      <stop offset="1" stop-color="#cfccc3"/>
    </linearGradient>
    <linearGradient id="tie" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffd490"/>
      <stop offset="0.5" stop-color="#f5b14c"/>
      <stop offset="1" stop-color="#dd9330"/>
    </linearGradient>

    <!-- soft-shadow filters -->
    <filter id="b3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b6" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b12" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="b20" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="20"/></filter>

    <clipPath id="frame"><rect width="400" height="500" rx="0"/></clipPath>
    <!-- head silhouette, reused to clip face shading + texture -->
    <clipPath id="headClip">
      <path d="M200,100 C240,100 266,132 266,180 C266,206 262,234 246,260 C234,284 218,302 200,303 C182,302 166,284 154,260 C138,234 134,206 134,180 C134,132 160,100 200,100 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- background -->
    <rect width="400" height="500" fill="url(#bg)"/>
    <rect width="400" height="500" fill="url(#halo)"/>

    <!-- grounding shadow behind the bust -->
    <ellipse cx="200" cy="470" rx="170" ry="90" fill="#000000" opacity="0.4" filter="url(#b20)"/>

    <!-- ===== SUIT ===== -->
    <path d="M36 500 C36 408 78 356 150 334 C172 328 228 328 250 334 C322 356 364 408 364 500 Z" fill="url(#jacket)"/>
    <!-- shoulder highlight (key light, upper-left) -->
    <path d="M150 334 C110 350 78 384 64 430" stroke="#454b56" stroke-width="6" fill="none" opacity="0.5" filter="url(#b6)"/>
    <!-- fold shadows -->
    <path d="M132 360 C120 410 116 460 120 500" stroke="#12151a" stroke-width="14" fill="none" opacity="0.5" filter="url(#b12)"/>
    <path d="M268 360 C280 410 284 460 280 500" stroke="#0e1116" stroke-width="14" fill="none" opacity="0.6" filter="url(#b12)"/>

    <!-- shirt -->
    <path d="M164 330 L200 388 L236 330 L236 372 C236 410 200 430 200 430 C200 430 164 410 164 372 Z" fill="url(#shirt)"/>
    <!-- shirt inner shadow near neck -->
    <path d="M176 330 L200 372 L224 330 Z" fill="#000000" opacity="0.16" filter="url(#b6)"/>

    <!-- collar flaps -->
    <path d="M164 330 L200 388 L172 342 Z" fill="#ffffff"/>
    <path d="M236 330 L200 388 L228 342 Z" fill="#f2efe8"/>

    <!-- lapels -->
    <path d="M164 330 L200 388 L146 500 L104 500 C108 408 128 356 164 336 Z" fill="url(#lapel)"/>
    <path d="M236 330 L200 388 L254 500 L296 500 C292 408 272 356 236 336 Z" fill="url(#lapel)"/>
    <path d="M164 332 L198 386" stroke="#474d57" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M236 332 L202 386" stroke="#2a2f37" stroke-width="2.5" fill="none" opacity="0.8"/>

    <!-- tie -->
    <path d="M200 388 L186 406 L200 500 L214 406 Z" fill="url(#tie)"/>
    <path d="M200 388 L200 500" stroke="#ffe0ad" stroke-width="2" opacity="0.4"/>
    <path d="M190 398 L210 398 L200 416 Z" fill="#cf8a2c"/>

    <!-- ===== NECK ===== -->
    <path d="M176 282 L176 340 C176 356 224 356 224 340 L224 282 Z" fill="url(#neckSkin)"/>
    <!-- under-jaw ambient occlusion -->
    <path d="M158 288 C176 316 224 316 242 288 C232 322 168 322 158 288 Z" fill="#4a2f19" opacity="0.55" filter="url(#b12)"/>

    <!-- ears -->
    <ellipse cx="135" cy="204" rx="15" ry="22" fill="url(#skin)"/>
    <ellipse cx="265" cy="204" rx="15" ry="22" fill="url(#skin)"/>
    <path d="M132 196 C142 200 143 214 136 220" stroke="#8a5c39" stroke-width="3" fill="none" opacity="0.6"/>
    <path d="M268 196 C258 200 257 214 264 220" stroke="#7a4f31" stroke-width="3" fill="none" opacity="0.6"/>

    <!-- warm rim light behind head (left kicker) -->
    <path d="M200,100 C240,100 266,132 266,180 C266,206 262,234 246,260 C234,284 218,302 200,303 C182,302 166,284 154,260 C138,234 134,206 134,180 C134,132 160,100 200,100 Z"
          fill="#f5b14c" opacity="0.5" filter="url(#b6)" transform="translate(-5 -2)"/>

    <!-- ===== HEAD ===== -->
    <path d="M200,100 C240,100 266,132 266,180 C266,206 262,234 246,260 C234,284 218,302 200,303 C182,302 166,284 154,260 C138,234 134,206 134,180 C134,132 160,100 200,100 Z" fill="url(#skin)"/>

    <!-- face shading (clipped to head) -->
    <g clip-path="url(#headClip)">
      <!-- form shadow, right side away from light -->
      <ellipse cx="252" cy="210" rx="40" ry="80" fill="url(#shade)"/>
      <ellipse cx="228" cy="272" rx="46" ry="42" fill="url(#shade)"/>
      <!-- temple / hairline shadow -->
      <ellipse cx="200" cy="150" rx="72" ry="30" fill="#3a2414" opacity="0.28" filter="url(#b12)"/>
      <!-- cheekbone + forehead highlights -->
      <ellipse cx="176" cy="168" rx="34" ry="40" fill="url(#spec)"/>
      <ellipse cx="168" cy="214" rx="20" ry="15" fill="url(#spec)" opacity="0.8"/>
      <ellipse cx="200" cy="238" rx="9" ry="14" fill="url(#spec)"/>
      <ellipse cx="200" cy="288" rx="16" ry="12" fill="url(#spec)" opacity="0.7"/>
      <!-- cheek blush for life -->
      <ellipse cx="166" cy="238" rx="22" ry="16" fill="url(#blush)"/>
      <ellipse cx="234" cy="238" rx="22" ry="16" fill="url(#blush)"/>
    </g>

    <!-- ===== HAIR ===== -->
    <path d="M200 88
             C152 88 122 122 122 176
             C122 190 125 202 131 212
             C129 188 133 166 145 152
             C140 168 141 184 147 196
             C150 172 160 154 178 146
             C176 152 175 158 176 164
             C188 150 212 150 224 164
             C225 158 224 152 222 146
             C240 154 250 172 253 196
             C259 184 260 168 255 152
             C267 166 271 188 269 212
             C275 202 278 190 278 176
             C278 122 248 88 200 88 Z" fill="url(#hair)"/>
    <!-- hair sheen -->
    <path d="M158 120 C176 106 224 106 242 120" stroke="#4a4136" stroke-width="7" fill="none" opacity="0.5" filter="url(#b3)"/>
    <path d="M150 150 C168 134 200 130 214 134" stroke="#5a4f40" stroke-width="4" fill="none" opacity="0.4" filter="url(#b3)"/>
    <!-- hairline cast shadow on forehead -->
    <path d="M147 160 C170 150 230 150 253 160 C230 168 170 168 147 160 Z" fill="#3a2414" opacity="0.35" filter="url(#b6)"/>

    <!-- ===== BROWS ===== -->
    <path d="M156 186 C168 179 184 179 194 185" stroke="#231a12" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#b3)"/>
    <path d="M206 185 C216 179 232 179 244 186" stroke="#1f1710" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#b3)"/>

    <!-- ===== EYES ===== -->
    <!-- socket shadow -->
    <ellipse cx="172" cy="203" rx="20" ry="12" fill="#6e4526" opacity="0.28" filter="url(#b6)"/>
    <ellipse cx="228" cy="203" rx="20" ry="12" fill="#6e4526" opacity="0.28" filter="url(#b6)"/>
    <!-- eye whites -->
    <path d="M156 202 C164 194 182 194 189 202 C182 210 164 210 156 202 Z" fill="#efece4"/>
    <path d="M211 202 C218 194 236 194 244 202 C236 210 218 210 211 202 Z" fill="#efece4"/>
    <!-- iris + pupil -->
    <g>
      <circle cx="173" cy="202" r="7" fill="#5b3d24"/>
      <circle cx="173" cy="202" r="3.4" fill="#160f08"/>
      <circle cx="171" cy="199.5" r="1.6" fill="#fff" opacity="0.9"/>
    </g>
    <g>
      <circle cx="227" cy="202" r="7" fill="#54381f"/>
      <circle cx="227" cy="202" r="3.4" fill="#160f08"/>
      <circle cx="225" cy="199.5" r="1.6" fill="#fff" opacity="0.9"/>
    </g>
    <!-- upper lid lines -->
    <path d="M156 201 C164 193 182 193 190 201" stroke="#3a271a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M210 201 C218 193 236 193 244 201" stroke="#3a271a" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9"/>

    <!-- ===== NOSE ===== -->
    <path d="M200 190 L196 236" stroke="#fff3e2" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.4" filter="url(#b3)"/>
    <path d="M212 218 C220 232 216 246 202 248" stroke="#8a5c39" stroke-width="3" fill="none" opacity="0.4" filter="url(#b3)"/>
    <ellipse cx="200" cy="238" rx="7" ry="5" fill="url(#spec)"/>
    <ellipse cx="190" cy="244" rx="4" ry="3" fill="#5a3a20" opacity="0.5" filter="url(#b3)"/>
    <ellipse cx="210" cy="244" rx="4" ry="3" fill="#4a2f19" opacity="0.55" filter="url(#b3)"/>

    <!-- ===== MOUTH ===== -->
    <!-- philtrum shadow -->
    <path d="M200 250 L200 260" stroke="#8a5c39" stroke-width="2" opacity="0.3" filter="url(#b3)"/>
    <path d="M178 262 C186 258 194 259 200 261 C206 259 214 258 222 262 C214 268 206 270 200 270 C194 270 186 268 178 262 Z" fill="#a85c46"/>
    <path d="M178 262 C188 267 212 267 222 262" stroke="#6e3826" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- lower-lip highlight -->
    <path d="M188 270 C194 274 206 274 212 270" stroke="#e39a7a" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6" filter="url(#b3)"/>
    <!-- subtle jaw stubble shadow -->
    <path d="M164 262 C176 292 224 292 236 262 C232 300 168 300 164 262 Z" fill="#3a2414" opacity="0.12" filter="url(#b12)"/>

    <!-- ===== GLASSES ===== -->
    <g>
      <!-- shadow cast on cheeks -->
      <rect x="150" y="200" width="44" height="30" rx="10" fill="#3a2414" opacity="0.18" filter="url(#b6)" transform="translate(2 5)"/>
      <rect x="206" y="200" width="44" height="30" rx="10" fill="#3a2414" opacity="0.18" filter="url(#b6)" transform="translate(2 5)"/>
      <!-- lens tint -->
      <rect x="150" y="188" width="44" height="30" rx="10" fill="#9fb4c9" opacity="0.1"/>
      <rect x="206" y="188" width="44" height="30" rx="10" fill="#9fb4c9" opacity="0.1"/>
      <!-- lens reflection streak -->
      <path d="M156 214 L176 192" stroke="#ffffff" stroke-width="3" opacity="0.25" stroke-linecap="round"/>
      <path d="M212 214 L232 192" stroke="#ffffff" stroke-width="3" opacity="0.22" stroke-linecap="round"/>
      <!-- frames -->
      <g fill="none" stroke="#26221d" stroke-width="4">
        <rect x="150" y="188" width="44" height="30" rx="10"/>
        <rect x="206" y="188" width="44" height="30" rx="10"/>
      </g>
      <path d="M194 200 L206 200" stroke="#26221d" stroke-width="4"/>
      <path d="M150 199 L134 195" stroke="#26221d" stroke-width="4" stroke-linecap="round"/>
      <path d="M250 199 L266 195" stroke="#26221d" stroke-width="4" stroke-linecap="round"/>
      <!-- frame top highlight -->
      <path d="M154 190 L188 190" stroke="#6a6258" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/>
      <path d="M210 190 L244 190" stroke="#6a6258" stroke-width="1.6" opacity="0.7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
