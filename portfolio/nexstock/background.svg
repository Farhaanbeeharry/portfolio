<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" width="1200" height="520" font-family="Lexend, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c3a37"/>
      <stop offset="1" stop-color="#04120f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".84" cy=".22" r=".62">
      <stop offset="0" stop-color="#04dde2" stop-opacity=".3"/>
      <stop offset="1" stop-color="#04dde2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0d9488" stop-opacity=".3"/>
      <stop offset="1" stop-color="#04dde2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#glow)"/>

  <!-- isometric lattice -->
  <g stroke="#04dde2" stroke-opacity=".08" fill="none">
    <path d="M700 -60 L1260 260M780 -60 L1340 260M860 -60 L1420 260M620 -60 L1180 260"/>
