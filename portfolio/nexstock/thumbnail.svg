<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600" font-family="Lexend, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="n-bg" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#f7fdfc"/>
      <stop offset=".5" stop-color="#e9f8f6"/>
      <stop offset="1" stop-color="#d6f0ec"/>
    </linearGradient>
    <radialGradient id="n-glow" cx=".5" cy=".36" r=".6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="n-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#10b3a6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0fd6c4" stop-opacity=".95"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#n-bg)"/>

  <!-- isometric crate lattice -->
  <g stroke="#0f8f86" stroke-opacity=".13" fill="none">
    <path d="M-40 200 L360 -20M60 200 L460 -20M160 200 L560 -20M260 200 L660 -20M360 200 L760 -20M460 200 L860 -20"/>
    <path d="M-40 -20 L360 200M60 -20 L460 200M160 -20 L560 200M260 -20 L660 200M360 -20 L760 200M460 -20 L860 200"/>
  </g>
  <g fill="none" stroke="#0fd6c4" stroke-opacity=".26">
    <path d="M400 66 L556 156 L556 336 L400 426 L244 336 L244 156 Z"/>
    <path d="M400 118 L512 182 L512 310 L400 374 L288 310 L288 182 Z" stroke-opacity=".14"/>
  </g>
  <rect width="800" height="600" fill="url(#n-glow)"/>

  <!-- stock chart -->
  <g>
    <rect x="92"  y="418" width="26" height="42" rx="5" fill="url(#n-bar)"/>
    <rect x="130" y="392" width="26" height="68" rx="5" fill="url(#n-bar)"/>
    <rect x="168" y="404" width="26" height="56" rx="5" fill="url(#n-bar)"/>
    <rect x="206" y="364" width="26" height="96" rx="5" fill="url(#n-bar)"/>
    <rect x="92" y="466" width="140" height="4" rx="2" fill="#0f8f86" opacity=".3"/>
  </g>
  <!-- warehouse boxes -->
  <g fill="none" stroke="#0f8f86" stroke-opacity=".42" stroke-width="2.2">
    <rect x="574" y="418" width="48" height="42" rx="6"/>
    <rect x="632" y="418" width="48" height="42" rx="6"/>
    <rect x="603" y="368" width="48" height="42" rx="6"/>
    <path d="M574 432h48M632 432h48M603 382h48"/>
  </g>
  <circle cx="694" cy="376" r="13" fill="#0fd6c4" opacity=".9"/>
  <path d="M689 376l3.6 4 6-7" fill="none" stroke="#ffffff" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <image x="130.0" y="187.8" width="540.0" height="112.5" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/>

  <rect x="352" y="504" width="96" height="5" rx="2.5" fill="#0fd6c4"/>
  <text x="400" y="552" text-anchor="middle" font-size="19" font-weight="600"
        fill="#245e5a" letter-spacing="4.6">INVENTORY &amp; STOCK PLATFORM</text>
</svg>
