<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" width="1200" height="520" font-family="Lexend, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1c4a"/><stop offset="1" stop-color="#0a0a1c"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".16" r=".7">
      <stop offset="0" stop-color="#6063ee" stop-opacity=".36"/>
      <stop offset="1" stop-color="#6063ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#glow)"/>

  <g fill="none" stroke="#8b8cff" stroke-opacity=".12">
    <circle cx="1000" cy="150" r="210"/><circle cx="1000" cy="150" r="134"/>
  </g>
  <g opacity=".5">
    <rect x="640" y="66" width="12" height="12" rx="3" fill="#831ada" transform="rotate(22 646 72)"/>
    <rect x="1130" y="330" width="11" height="11" rx="3" fill="#4648d4" transform="rotate(-18 1135 335)"/>
    <circle cx="700" cy="430" r="5" fill="#9e41f5"/>
    <circle cx="1160" cy="120" r="4" fill="#c0c1ff"/>
  </g>

  <rect x="84" y="48" width="440" height="106" rx="18" fill="#ffffff" opacity=".97"/>
  <image x="116.0" y="63.4" width="376.0" height="75.2" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/>

  <text x="92" y="200" font-size="23" font-weight="600" fill="#c0c1ff"
        letter-spacing="3">TEAM PREDICTION GAME</text>
  <text x="92" y="236" font-size="20" fill="#8f90bd">Workspaces, live leaderboards and mini-games.</text>

  <!-- podium -->
  <g transform="translate(92,268)">
    <path d="M96 18 l9 -28 8 16 9 -21 9 21 8 -16 9 28 z" fill="#c0c1ff" opacity=".9"/>
    <rect x="20" y="66" width="72" height="60" rx="10" fill="#4648d4" opacity=".45"/>
    <rect x="100" y="26" width="82" height="100" rx="10" fill="#6063ee"/>
    <rect x="190" y="82" width="72" height="44" rx="10" fill="#4648d4" opacity=".35"/>
    <text x="56" y="106" text-anchor="middle" font-size="24" font-weight="700" fill="#e1e0ff">2</text>
    <text x="141" y="86" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">1</text>
    <text x="226" y="114" text-anchor="middle" font-size="20" font-weight="700" fill="#e1e0ff">3</text>
    <rect x="8" y="130" width="266" height="5" rx="2.5" fill="#6063ee" opacity=".3"/>
  </g>

  <!-- browser: challenge + leaderboard -->
  <g transform="translate(700,46)">
    <rect x="0" y="0" width="428" height="298" rx="16" fill="#12122c" stroke="#2e2e5c" stroke-width="2"/>
    <rect x="0" y="0" width="428" height="34" rx="16" fill="#1c1c40"/>
    <rect x="0" y="20" width="428" height="14" fill="#1c1c40"/>
    <circle cx="22" cy="17" r="5" fill="#ff5f57"/><circle cx="40" cy="17" r="5" fill="#febc2e"/>
    <circle cx="58" cy="17" r="5" fill="#28c840"/>
    <rect x="78" y="10" width="188" height="14" rx="7" fill="#12122c"/>

    <!-- challenge card -->
    <g transform="translate(20,52)">
      <rect x="0" y="0" width="234" height="130" rx="12" fill="#181838" stroke="#2e2e5c"/>
      <rect x="16" y="16" width="58" height="16" rx="8" fill="#9e41f5" opacity=".3"/>
      <rect x="16" y="44" width="150" height="9" rx="4.5" fill="#e4e1ed"/>
      <rect x="16" y="62" width="106" height="7" rx="3.5" fill="#575682"/>
      <g>
        <rect x="16" y="82" width="202" height="18" rx="9" fill="#6063ee"/>
        <rect x="28" y="88" width="70" height="6" rx="3" fill="#ffffff" opacity=".85"/>
        <rect x="182" y="87" width="24" height="8" rx="4" fill="#ffffff" opacity=".6"/>
      </g>
      <g>
        <rect x="16" y="106" width="202" height="14" rx="7" fill="#2b2b57"/>
        <rect x="28" y="110" width="54" height="6" rx="3" fill="#8f90bd"/>
      </g>
    </g>

    <!-- leaderboard -->
    <g transform="translate(268,52)">
      <rect x="0" y="0" width="142" height="130" rx="12" fill="#181838" stroke="#2e2e5c"/>
      <rect x="14" y="14" width="70" height="8" rx="4" fill="#c0c1ff" opacity=".8"/>
      <g>
        <circle cx="24" cy="42" r="9" fill="#6063ee"/><rect x="40" y="38" width="60" height="7" rx="3.5" fill="#d8d7ee"/>
        <rect x="108" y="38" width="20" height="7" rx="3.5" fill="#6063ee"/>
        <circle cx="24" cy="66" r="9" fill="#4648d4" opacity=".6"/><rect x="40" y="62" width="52" height="7" rx="3.5" fill="#8f90bd"/>
        <rect x="112" y="62" width="16" height="7" rx="3.5" fill="#4b4b7d"/>
        <circle cx="24" cy="90" r="9" fill="#4648d4" opacity=".45"/><rect x="40" y="86" width="58" height="7" rx="3.5" fill="#8f90bd"/>
        <rect x="112" y="86" width="16" height="7" rx="3.5" fill="#4b4b7d"/>
        <circle cx="24" cy="112" r="9" fill="#4648d4" opacity=".3"/>
        <rect x="40" y="108" width="46" height="7" rx="3.5" fill="#8f90bd"/>
      </g>
    </g>

    <!-- mini-games strip -->
    <g transform="translate(20,198)">
      <rect x="0" y="0" width="390" height="78" rx="12" fill="#181838" stroke="#2e2e5c"/>
      <g transform="translate(16,16)">
        <rect x="0" y="0" width="112" height="46" rx="10" fill="#6063ee" opacity=".22"/>
        <text x="14" y="20" font-size="11" font-weight="700" fill="#c0c1ff">MATHDOWN</text>
        <rect x="14" y="28" width="52" height="6" rx="3" fill="#575682"/>
      </g>
      <g transform="translate(140,16)">
        <rect x="0" y="0" width="112" height="46" rx="10" fill="#9e41f5" opacity=".22"/>
        <text x="14" y="20" font-size="11" font-weight="700" fill="#ddb8ff">PINPOINT</text>
        <rect x="14" y="28" width="46" height="6" rx="3" fill="#575682"/>
      </g>
      <g transform="translate(264,16)">
        <rect x="0" y="0" width="110" height="46" rx="10" fill="#2b2b57"/>
        <text x="14" y="20" font-size="11" font-weight="700" fill="#8f90bd">STREAKS</text>
        <rect x="14" y="28" width="40" height="6" rx="3" fill="#4b4b7d"/>
      </g>
    </g>
