<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600" font-family="Lexend, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset=".5" stop-color="#f2eefc"/>
      <stop offset="1" stop-color="#e6ddf7"/>
    </linearGradient>
    <radialGradient id="p-glow" cx=".5" cy=".38" r=".62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5b2d91" stop-opacity=".18"/>
      <stop offset="1" stop-color="#5b2d91" stop-opacity=".62"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#p-bg)"/>
  <g fill="none" stroke="#5b2d91" stroke-opacity=".12">
    <circle cx="400" cy="272" r="286"/>
    <circle cx="400" cy="272" r="224"/>
    <circle cx="400" cy="272" r="162"/>
  </g>
  <rect width="800" height="600" fill="url(#p-glow)"/>

  <!-- confetti -->
  <g opacity=".55">
    <rect x="112" y="104" width="13" height="13" rx="3" fill="#5b2d91" transform="rotate(20 118 110)"/>
    <rect x="668" y="132" width="11" height="11" rx="3" fill="#7b4bc0" transform="rotate(-24 673 137)"/>
    <rect x="176" y="404" width="10" height="10" rx="3" fill="#7b4bc0" transform="rotate(35 181 409)"/>
    <rect x="624" y="392" width="13" height="13" rx="3" fill="#5b2d91" transform="rotate(-14 630 398)"/>
    <circle cx="84"  cy="264" r="5" fill="#5b2d91"/>
    <circle cx="716" cy="252" r="5" fill="#5b2d91"/>
    <circle cx="248" cy="120" r="4" fill="#7b4bc0"/>
    <circle cx="552" cy="428" r="4" fill="#7b4bc0"/>
  </g>

  <!-- leaderboard podium -->
  <g>
    <path d="M368 358 l8 -26 7 15 8 -19 8 19 7 -15 8 26 z" fill="#5b2d91" opacity=".9"/>
    <rect x="266" y="410" width="78" height="66" rx="10" fill="url(#p-bar)"/>
    <rect x="356" y="368" width="88" height="108" rx="10" fill="#5b2d91" opacity=".8"/>
    <rect x="456" y="430" width="78" height="46" rx="10" fill="url(#p-bar)"/>
    <text x="305" y="452" text-anchor="middle" font-size="26" font-weight="700"
          fill="#ffffff" opacity=".85">2</text>
    <text x="400" y="432" text-anchor="middle" font-size="32" font-weight="700"
          fill="#ffffff">1</text>
    <text x="495" y="463" text-anchor="middle" font-size="22" font-weight="700"
          fill="#ffffff" opacity=".8">3</text>
    <rect x="250" y="482" width="300" height="5" rx="2.5" fill="#5b2d91" opacity=".22"/>
  </g>

  <image x="120.0" y="160.0" width="560.0" height="112.0" preserveAspectRatio="xMidYMid meet" xlink:href="data:image/png;base64,"/>

  <text x="400" y="552" text-anchor="middle" font-size="19" font-weight="600"
        fill="#4a3766" letter-spacing="4.6">TEAM PREDICTION GAME</text>
</svg>
