<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Lexend, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a14"/>
      <stop offset="1" stop-color="#060e0a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c96e"/>
      <stop offset="1" stop-color="#bb9a65"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.14" r="0.62">
      <stop offset="0" stop-color="#c4a452" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#c4a452" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect width="1200" height="520" fill="url(#glow)"/>

  <!-- concentric brand rings -->
  <g stroke="#c4a452" stroke-opacity="0.13" fill="none">
    <circle cx="1000" cy="112" r="238"/>
    <circle cx="1000" cy="112" r="158"/>
    <circle cx="1000" cy="112" r="82"/>
  </g>

  <!-- title block -->
  <rect x="90" y="128" width="54" height="4" rx="2" fill="url(#gold)"/>
  <text x="88" y="216" font-size="86" font-weight="700" fill="#f0ece4" letter-spacing="-1">Concept Habitat</text>
  <text x="92" y="266" font-size="25" font-weight="500" fill="#c4a452" letter-spacing="3.5">WEBSITE · EVENT CRM · MOBILE APP</text>
  <text x="92" y="308" font-size="21" fill="#a0a092">Rose Hill showroom, since 1986 — one Supabase project, three products.</text>

  <!-- three surfaces -->
  <g transform="translate(92,352)">
    <!-- 1. website -->
    <g>
      <rect x="0" y="0" width="196" height="112" rx="12" fill="#0b1813" stroke="#2b3a32"/>
      <rect x="0" y="0" width="196" height="20" rx="12" fill="#101f19"/>
      <rect x="0" y="14" width="196" height="6" fill="#101f19"/>
      <circle cx="14" cy="10" r="3.2" fill="#c0544a"/>
      <circle cx="25" cy="10" r="3.2" fill="#c47840"/>
      <circle cx="36" cy="10" r="3.2" fill="#40a060"/>
      <rect x="52" y="7" width="86" height="6" rx="3" fill="#ffffff" fill-opacity="0.10"/>
      <rect x="14" y="34" width="104" height="9" rx="4" fill="#f0ece4" fill-opacity="0.85"/>
      <rect x="14" y="50" width="70" height="7" rx="3.5" fill="#c4a452" fill-opacity="0.65"/>
      <rect x="14" y="72" width="52" height="26" rx="6" fill="#0d1e14" stroke="#2b3a32"/>
      <rect x="72" y="72" width="52" height="26" rx="6" fill="#0d1e14" stroke="#2b3a32"/>
      <rect x="130" y="72" width="52" height="26" rx="6" fill="url(#gold)"/>
      <text x="98" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#8a8a81" letter-spacing="1.4">WEBSITE</text>
    </g>

    <!-- 2. event CRM dashboard -->
    <g transform="translate(232,0)">
      <rect x="0" y="0" width="196" height="112" rx="12" fill="#0b1813" stroke="#2b3a32"/>
      <rect x="0" y="0" width="46" height="112" rx="12" fill="#101f19"/>
      <rect x="34" y="0" width="12" height="112" fill="#101f19"/>
      <rect x="10" y="14" width="26" height="6" rx="3" fill="#c4a452" fill-opacity="0.75"/>
      <rect x="10" y="32" width="26" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="10" y="45" width="26" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="10" y="58" width="26" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="58" y="14" width="34" height="30" rx="6" fill="url(#gold)"/>
      <rect x="98" y="14" width="34" height="30" rx="6" fill="#0d1e14" stroke="#2b3a32"/>
      <rect x="138" y="14" width="42" height="30" rx="6" fill="#0d1e14" stroke="#2b3a32"/>
      <g fill="#c4a452" fill-opacity="0.62">
        <rect x="58" y="80" width="14" height="18" rx="3"/>
        <rect x="78" y="70" width="14" height="28" rx="3"/>
        <rect x="98" y="76" width="14" height="22" rx="3"/>
        <rect x="118" y="60" width="14" height="38" rx="3"/>
        <rect x="138" y="66" width="14" height="32" rx="3"/>
      </g>
      <rect x="158" y="54" width="22" height="44" rx="3" fill="#c4a452"/>
      <text x="98" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#8a8a81" letter-spacing="1.4">EVENT CRM</text>
    </g>

    <!-- 3. mobile app -->
    <g transform="translate(474,-6)">
      <rect x="0" y="0" width="72" height="124" rx="14" fill="#0b1813" stroke="#2b3a32"/>
      <rect x="26" y="8" width="20" height="3.5" rx="1.75" fill="#ffffff" fill-opacity="0.20"/>
      <rect x="10" y="22" width="34" height="7" rx="3.5" fill="#f0ece4" fill-opacity="0.80"/>
      <rect x="10" y="38" width="24" height="20" rx="5" fill="url(#gold)"/>
      <rect x="38" y="38" width="24" height="20" rx="5" fill="#0d1e14" stroke="#2b3a32"/>
      <rect x="10" y="64" width="52" height="20" rx="5" fill="#0d1e14" stroke="#2b3a32"/>
      <rect x="16" y="70" width="26" height="4" rx="2" fill="#c4a452" fill-opacity="0.60"/>
      <rect x="10" y="90" width="52" height="9" rx="4.5" fill="#c4a452" fill-opacity="0.30"/>
      <g fill="#c4a452" fill-opacity="0.55">
        <circle cx="15" cy="112" r="3"/>
        <circle cx="28" cy="112" r="3"/>
        <circle cx="41" cy="112" r="3"/>
        <circle cx="54" cy="112" r="3"/>
      </g>
      <text x="36" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#8a8a81" letter-spacing="1.4">APP</text>
    </g>
  </g>
</svg>
