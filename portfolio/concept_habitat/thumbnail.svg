  </g>

  <text x="400" y="452" text-anchor="middle" font-size="54" font-weight="700" fill="#f0ece4" letter-spacing="-0.5">Concept Habitat</text>
  <text x="400" y="496" text-anchor="middle" font-size="20" font-weight="500" fill="#c4a452" letter-spacing="3.5">WEB · CRM · MOBILE</text>

