<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" font-family="Lexend, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a14"/>
      <stop offset="1" stop-color="#050c08"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c96e"/>
      <stop offset="1" stop-color="#bb9a65"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.26" r="0.72">
      <stop offset="0" stop-color="#c4a452" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#c4a452" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>

  <g fill="none" stroke="#c4a452" stroke-opacity="0.16">
    <circle cx="400" cy="262" r="152"/>
    <circle cx="400" cy="262" r="98"/>
