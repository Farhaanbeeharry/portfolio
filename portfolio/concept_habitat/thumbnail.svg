      <rect x="0" y="8" width="38" height="94" rx="11" fill="#101f19"/>
      <rect x="28" y="8" width="10" height="94" fill="#101f19"/>
      <rect x="9" y="20" width="20" height="5" rx="2.5" fill="#c4a452" fill-opacity="0.75"/>
      <rect x="9" y="36" width="20" height="4" rx="2" fill="#ffffff" fill-opacity="0.16"/>
